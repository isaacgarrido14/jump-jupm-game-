#msg.on{opacity:1}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(10,18,40,.5)}
.panel{background:var(--navy);border-radius:20px;padding:20px;width:min(560px,100%);max-height:94%;overflow:auto;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45)}

p{margin:6px 0;opacity:.88}
#bank{color:var(--coin);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.c{font:inherit;color:inherit;background:var(--soft);border:2px solid transparent;border-radius:14px;padding:9px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.c.on{border-color:var(--coin)}.c:disabled{opacity:.4;cursor:default}
.c:focus-visible,.b:focus-visible{outline:3px solid #fff;outline-offset:2px}
.c i{width:32px;height:32px;border-radius:10px;display:block}
.c span{font-size:13px;opacity:.85}
.b{font:inherit;font-weight:600;font-size:20px;background:var(--coin);color:#2a2100;border:0;border-radius:14px;padding:11px 20px;cursor:pointer}
.b.s{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:14px}.row .b{flex:1}
.g.n{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));max-height:150px;overflow:auto}.c.n{padding:8px 0;font-weight:600}.help{font-size:13px}

const clM=new THREE.MeshBasicMaterial({color:0xffffff,fog:false,transparent:true,opacity:.85}),clouds=[];
for(let i=0;i<9;i++){const g=new THREE.Group();for(let j=0;j<4;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(5+Math.random()*4,10,8),clM);s.position.set(j*6-9,Math.random()*3,Math.random()*4);s.scale.y=.55;g.add(s)}g.position.set(-90+i*24,32+Math.random()*14,-150);scene.add(g);clouds.push(g)}
function applyChar(){const c=CH[S.sel];shM.color.setHex(c.sh);paM.color.setHex(c.pa);skM.color.setHex(c.sk);acM.color.setHex(c.ac||0xffffff);for(const k in ACC)ACC[k].forEach(m=>m.visible=c.acc===k);KING.forEach(m=>m.visible=c.acc==='crown');hair.visible=!['helmet','tophat','crown'].includes(c.acc)&&!['Robot','Cíborg','Alienígena','Fantasma','Astronauta'].includes(c.n);hair.material.color.setHex(c.hr||0x3a2616)}

let mode='menu',objs=[],lane=0,y=0,vy=0,jumps=0,slide=0,dist=0,speed=12,goal=300,lvl=0,run=0,gap=0,t=0;
let mag=0,dbl=0,shd=false,inv=0,tutS=0,tutT=0,tutRetry=0;
function mkOb(k,l,z){
 const m=new THREE.Group();let hw=1,d=.6,h=2.2,y0=0,sp=0;
 const B=(w,hh,dd,c,x,yy,zz)=>bx(w,hh,dd,mat(c),x,yy,zz,m);
 if(k==='tall'){B(2,1.1,1.2,0x8a5a2b,0,.55,0);B(1.6,1.1,1,0x9c6a36,0,1.65,0)}
 else if(k==='low'){B(7.6,.7,.5,0xe8e8e8,0,.35,0);B(7.6,.2,.51,0xd62f2f,0,.45,0);hw=3.8;d=.3;h=.7}
 else if(k==='high'){B(.3,2.2,.3,0x555555,-3.6,1.1,0);B(.3,2.2,.3,0x555555,3.6,1.1,0);B(7.6,.7,.4,0xd6a62f,0,1.75,0);hw=3.8;d=.3;y0=1.4;h=.7}
 else if(k==='spikes'){for(let i=-2;i<3;i++){const c=mk(new THREE.ConeGeometry(.22,.6,6),mat(0xb0b6bd,.3),i*.38,.3,0);c.castShadow=true;m.add(c)}hw=1;d=.5;h=.6}
 else if(k==='car'){B(1.8,.7,3.6,0x2f7bd6,0,.6,0);B(1.5,.6,1.8,0x9fd0f0,0,1.25,.2);hw=.95;d=1.8;h=1.5;sp=7}
 else{const c=mk(new THREE.CylinderGeometry(.55,.55,1.1,14),mat(0x7a4a22),0,.55,0);c.rotation.z=Math.PI/2;c.castShadow=true;m.add(c);m.userData.s=c;hw=.65;d=.55;h=1.1;sp=5}
 m.position.set(l*LANE,0,z);scene.add(m);objs.push({m,t:'ob',hw,d,h,y0,sp});
}
const cG=new THREE.CylinderGeometry(.4,.4,.12,16);cG.rotateX(Math.PI/2);const cM=mat(0xffc933,.3,0x5a4300);
function coin(l,yy,z){const m=new THREE.Mesh(cG,cM);m.position.set(l*LANE,yy,z);m.castShadow=true;scene.add(m);objs.push({m,t:'coin'})}
const PU={mag:0xff4d6d,shd:0x4dd2ff,dbl:0x7bff6b};
function pu(k,l,z){const m=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),mat(PU[k],.2,PU[k]));m.position.set(l*LANE,1.2,z);scene.add(m);objs.push({m,t:'pu',k})}
const rl=()=>Math.floor(Math.random()*3)-1;
function spawn(){
 const z=-90,al=ALLOW[Math.min(lvl,5)],k=al[Math.random()*al.length|0],r=Math.random();
 if(r<.08){pu(['mag','shd','dbl'][Math.random()*3|0],rl(),z)}
 else if(r<.22){const l=rl();for(let i=0;i<6;i++)coin(l,1,z-i*2)}
 else if(k==='tall'||k==='spikes'||k==='barrel'){const f=rl();for(let l=-1;l<=1;l++)if(l!==f&&Math.random()<.85)mkOb(k,l,z);for(let i=0;i<4;i++)coin(f,1,z-i*2)}
 else if(k==='car'){const l=rl();mkOb('car',l,z);if(Math.random()<.5)mkOb('car',l===1?-1:l+1,z-6);coin(-l,1,z-3)}
 else if(k==='low'){mkOb('low',0,z);const l=rl();for(let i=-1;i<=1;i++)coin(l,1.5+(1-Math.abs(i))*.7,z+i*1.8)}
 else{mkOb('high',0,z);const l=rl();for(let i=0;i<4;i++)coin(l,.6,z-i*1.5)}
 gap=Math.max(8.5,24-Math.min(lvl,5)*1.6-Math.max(0,lvl-5)*.1);
}
const TUT=[
['Cambia de carril con las flechas izquierda y derecha, o desliza de lado. Esquiva la caja.',()=>mkOb('tall',0,-45)],
['Salta con la flecha arriba o espacio, o desliza hacia arriba. Pasa por encima de la barrera. Puedes saltar otra vez en el aire.',()=>mkOb('low',0,-45)],
['Deslízate con la flecha abajo o S, o desliza hacia abajo. Pasa por debajo de la viga.',()=>mkOb('high',0,-45)],
['Recoge las monedas. Con ellas desbloqueas personajes.',()=>{for(let i=0;i<7;i++)coin(1,1,-38-i*2)}],
['Las esferas de colores dan poderes: imán, escudo y monedas dobles. Recoge una.',()=>pu('shd',0,-40)]];
let mt;function msg(s,ms=0){const e=$('msg');e.textContent=s;e.classList.add('on');clearTimeout(mt);if(ms)mt=setTimeout(()=>e.classList.remove('on'),ms)}
function clear(){objs.forEach(o=>scene.remove(o.m));objs=[]}
function reset(){clear();lane=0;y=0;vy=0;jumps=0;slide=0;dist=0;run=0;mag=dbl=0;shd=false;inv=0;shield.visible=false;P.position.set(0,0,0);P.rotation.x=0;gap=14;hud()}
function hud(){$('hl').textContent=mode==='tut'?'Tutorial':'Nivel '+(lvl+1)+': '+T(lvl).n;$('hc').textContent='Monedas: '+run;
 $('pb').firstChild.style.width=mode==='tut'?'0':Math.min(100,dist/goal*100)+'%';
 $('pw').textContent=[mag>0?'Imán '+Math.ceil(mag)+'s':'',dbl>0?'Monedas x2 '+Math.ceil(dbl)+'s':'',shd?'Escudo':''].filter(Boolean).join('   ')}
function play(){reset();mode='play';goal=T(lvl).goal;speed=T(lvl).sp;setTheme(lvl);$('ui').style.display='none';$('hud').style.display='block';msg('Nivel '+(lvl+1)+': '+T(lvl).n,1500);hud()}
function tut(){reset();mode='tut';speed=9;tutS=0;tutT=0;setTheme(0);$('ui').style.display='none';$('hud').style.display='block';TUT[0][1]();msg(TUT[0][0]);hud()}
function menu(title,sub){mode='menu';clear();$('hud').style.display='none';$('msg').classList.remove('on');$('ttl').textContent=title;$('sub').textContent=sub;render();$('ui').style.display='flex'}
function crash(){
 if(mode==='tut'){clear();msg('Inténtalo otra vez.',1200);tutRetry=1.3;beep(120,.2,'sawtooth');return}
 S.coins+=run;save();beep(100,.4,'sawtooth');menu('¡Chocaste!','Llegaste a '+Math.floor(dist)+' de '+goal+' m y ganaste '+run+' monedas. Inténtalo otra vez.')}
function win(){
 const b=25+lvl*10;S.coins+=run+b;S.unl=Math.max(S.unl,Math.min(108,lvl+2));if(lvl<107)S.lv=lvl+1;save();beep(880,.3,'triangle');
 menu('¡Nivel completado!','Ganaste '+run+' monedas y '+b+' de bonus.'+(lvl<107?' Ya puedes jugar el nivel '+(lvl+2)+'.':' ¡Terminaste todos los niveles!'))}
function hit(){
 if(inv>0)return;
 if(shd){shd=false;shield.visible=false;inv=1.5;beep(300,.15);return}
 crash()}

function render(){
 $('bank').textContent=S.coins;$('lv').innerHTML='';$('chars').innerHTML='';
 for(let i=0;i<108;i++){const th=T(i),b=document.createElement('button');b.className='c n'+(S.lv===i?' on':'');b.disabled=i>=S.unl;
  b.textContent=i+1;b.title=th.n;b.onclick=()=>{S.lv=i;save();render()};$('lv').append(b)}
 $('go').textContent='Jugar nivel '+(S.lv+1);$('lvi').textContent='Nivel '+(S.lv+1)+': '+T(S.lv).n+', meta '+T(S.lv).goal+' m';
 CH.forEach((c,i)=>{const own=S.owned.includes(i),b=document.createElement('button');b.className='c'+(S.sel===i?' on':'');
  b.innerHTML='<i style="background:#'+c.sh.toString(16).padStart(6,'0')+'"></i><b>'+c.n+'</b><span>'+(own?(S.sel===i?'Elegido':'Elegir'):c.cost+' monedas')+'</span>';
  b.onclick=()=>{if(own)S.sel=i;else if(S.coins>=c.cost){S.coins-=c.cost;S.owned.push(i);S.sel=i}else{$('sub').textContent='Te faltan '+(c.cost-S.coins)+' monedas para desbloquear a '+c.n+'.';return}save();applyChar();render()};$('chars').append(b)});
}
$('go').onclick=()=>{lvl=S.lv;S.tut?play():tut()};$('tb').onclick=tut;

const L=()=>{if(mode!=='menu')lane=Math.max(-1,lane-1)},R=()=>{if(mode!=='menu')lane=Math.min(1,lane+1)};
function jump(){if(mode==='menu'||jumps>=2)return;vy=jumps?10:11.5;jumps++;slide=0;beep(520,.07)}
function dive(){if(mode==='menu')return;if(y>0)vy=-20;slide=.7}
addEventListener('keydown',e=>{const k=e.key;
 if(k==='ArrowLeft'||k==='a')L();else if(k==='ArrowRight'||k==='d')R();
 else if(k==='ArrowUp'||k==='w'||k===' '){if(mode!=='menu'){e.preventDefault();jump()}}
 else if(k==='ArrowDown'||k==='s'){if(mode!=='menu'){e.preventDefault();dive()}}});
let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>Math.abs(dy)){if(dx>30)R();else if(dx<-30)L()}else if(dy<-30)jump();else if(dy>30)dive()},{passive:true});

let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 const act=mode!=='menu',v=act?speed:3;gM.map.offset.y+=v*dt/4.4;pM.map.offset.y+=v*dt/4.4;
 dashes.forEach(d=>{d.position.z+=v*dt;if(d.position.z>8)d.position.z-=112});
 sides.forEach(s=>{s.position.z+=v*dt;if(s.position.z>10)s.position.z-=121});
 P.position.x+=(lane*LANE-P.position.x)*Math.min(1,dt*14);
 const px=P.position.x;
 if(act){
  vy-=32*dt;y+=vy*dt;if(y<=0){y=0;vy=0;jumps=0}
  if(slide>0)slide-=dt;
  inv=Math.max(0,inv-dt);mag=Math.max(0,mag-dt);dbl=Math.max(0,dbl-dt);
  P.visible=!(inv>0&&Math.floor(t*14)%2);
  const ph=slide>0?.9:2.1;
  if(mode==='play'){
   dist+=speed*dt;gap-=speed*dt;if(gap<=0)spawn();
   if(dist>=goal){win();return}
  }else{
   if(tutRetry>0){tutRetry-=dt;if(tutRetry<=0)TUT[tutS][1]();}
   else if(objs.length===0){tutT+=dt;if(tutT>1){tutT=0;tutS++;
    if(tutS>=TUT.length){S.tut=true;save();menu('¡Tutorial completado!','Ya sabes moverte, saltar y deslizarte. ¡Elige un nivel y juega!');return}
    TUT[tutS][1]();msg(TUT[tutS][0])}}
  }
  for(let i=objs.length-1;i>=0;i--){
   const o=objs[i],m=o.m;m.position.z+=(speed+(o.sp||0))*dt;
   if(o.t==='coin')m.rotation.y+=dt*4;
   if(o.t==='pu'){m.position.y=1.2+Math.sin(t*4)*.2}
   if(m.userData.s)m.userData.s.rotation.x-=dt*(speed+o.sp)*1.8;
   const dz=m.position.z;
   if(dz>7){scene.remove(m);objs.splice(i,1);continue}
   if(o.t==='coin'&&mag>0&&dz>-9&&dz<2){m.position.x+=(px-m.position.x)*Math.min(1,dt*7);m.position.y+=(1.1-m.position.y)*Math.min(1,dt*5)}
   const dx=Math.abs(m.position.x-px);
   if(o.t==='ob'){if(Math.abs(dz)<o.d+.3&&dx<o.hw+.35&&y<o.y0+o.h&&y+ph>o.y0){hit();if(mode==='menu')return;if(!objs.length)return}}
   else if(Math.abs(dz)<.9&&dx<1.1&&y<m.position.y+.8&&y+ph>m.position.y-.5){
    scene.remove(m);objs.splice(i,1);
    if(o.t==='coin'){run+=dbl>0?2:1;beep(1000,.05,'triangle')}
    else{beep(700,.15,'triangle');if(o.k==='mag')mag=8;else if(o.k==='dbl')dbl=10;else{shd=true;shield.visible=true}}
   }
  }
  if(mode!=='menu')hud();
 }
 P.position.y=slide>0&&y===0?.35:y;P.rotation.x=slide>0&&y===0?1.3:0;shield.rotation.y+=dt;capeG.rotation.x=.15+(y>0?.5:Math.abs(Math.sin(t*6))*.25*(act?1:.2));
 const sw=y>0?0:Math.sin(t*(act?speed*.9:4))*(act?.9:.15);
 lL.rotation.x=y>0?-.7:sw;lR.rotation.x=y>0?.4:-sw;aL.rotation.x=y>0?-2.4:-sw;aR.rotation.x=y>0?-2.4:sw;
 cam.position.set(px*.4,4.6,8.2);cam.lookAt(px*.2,1.3,-6);cam.fov=60+(act?(speed-9)*.35:0);cam.updateProjectionMatrix();
 blob.position.x=px;blob.scale.setScalar(Math.max(.4,1-y*.25));blob.visible=P.visible;clouds.forEach(c=>{c.position.x+=dt*1.2;if(c.position.x>110)c.position.x=-110});
 ren.render(scene,cam);
}
setTheme(0);applyChar();render();requestAnimationFrame(loop);
</script>
</body>
</html>
